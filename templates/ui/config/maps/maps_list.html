{% extends "ui/base.html" %}
{% load i18n static %}

{% block title %}{% trans "Tus mapas TPV" %}{% endblock %}

{% block content %}

<div class="page-head">
  <h1 class="h1">{% trans "Tus mapas TPV" %}</h1>
  <div class="page-head__right">
    <a class="btn" href="{% url 'ui:map_editor' %}">➕ {% trans "Crear mapa" %}</a>
  </div>
</div>

<section class="grid" id="mapsGrid">
  <!-- Se rellena por JS -->
</section>

<div class="mt-14">
  <a class="btn btn--ghost" href="{% url 'ui:config' %}">↩️ {% trans "Volver a Configuración" %}</a>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'ui/js/config/maps/maps_list.js' %}"></script>
{% endblock %}
