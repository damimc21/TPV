apiVersion: batch/v1
kind: Job
metadata:
  name: tpv-migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: 705775032253.dkr.ecr.us-east-1.amazonaws.com/tpv:latest
          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput &&
              python manage.py autorestaurar_s3
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tpv-secrets
                  key: django-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tpv-secrets
                  key: database-url
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_DEBUG
              value: "false"
            - name: AWS_STORAGE_BUCKET_NAME
              value: "tpv-media-705775032253"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpv-app
  labels:
    app: tpv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpv
  template:
    metadata:
      labels:
        app: tpv
    spec:
      containers:
        - name: tpv
          image: 705775032253.dkr.ecr.us-east-1.amazonaws.com/tpv:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tpv-secrets
                  key: django-secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tpv-secrets
                  key: database-url
            - name: DJANGO_ALLOWED_HOSTS
              value: "damiantpv.online,*"
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: "https://damiantpv.online"
            - name: DJANGO_DEBUG
              value: "false"
            - name: AWS_STORAGE_BUCKET_NAME
              value: "tpv-media-705775032253"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: DEFAULT_FROM_EMAIL
              value: "noreply@damiantpv.online"

            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tpv-email-secret
                  key: resend-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: tpv-service
spec:
  selector:
    app: tpv
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tpv-exportar-s3
spec:
  # Todos los dias a las 02:00 UTC (04:00 hora Madrid en verano)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: exportar-s3
              image: 705775032253.dkr.ecr.us-east-1.amazonaws.com/tpv:latest
              command: ["python", "manage.py", "exportar_s3"]
              env:
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tpv-secrets
                      key: django-secret-key
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tpv-secrets
                      key: database-url
                - name: DJANGO_ALLOWED_HOSTS
                  value: "*"
                - name: DJANGO_DEBUG
                  value: "false"
                - name: AWS_STORAGE_BUCKET_NAME
                  value: "tpv-media-705775032253"
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"