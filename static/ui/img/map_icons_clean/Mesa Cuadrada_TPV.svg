<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 295">
  <defs>
    <style>
      .mc-surface { fill: #f1efee; }
      .mc-trim    { fill: #4c3f2d; }
      .mc-leg     { fill: #9c7f53; }
      .mc-shadow  { fill: #a49a8e; }
    </style>
  </defs>
  <!-- Sombra/borde exterior -->
  <rect class="mc-trim" x="8" y="8" width="279" height="279" rx="6" ry="6"/>
  <!-- Superficie de la mesa -->
  <rect class="mc-surface" x="14" y="14" width="267" height="267" rx="4" ry="4"/>
  <!-- Borde interior decorativo -->
  <rect class="mc-shadow" x="20" y="20" width="255" height="255" rx="3" ry="3" fill="none" stroke="#a49a8e" stroke-width="2"/>
  <!-- Patas (esquinas, vista desde arriba) -->
  <rect class="mc-leg" x="18" y="18"  width="22" height="22" rx="3" ry="3"/>
  <rect class="mc-leg" x="255" y="18"  width="22" height="22" rx="3" ry="3"/>
  <rect class="mc-leg" x="18" y="255" width="22" height="22" rx="3" ry="3"/>
  <rect class="mc-leg" x="255" y="255" width="22" height="22" rx="3" ry="3"/>
  <!-- Veta de madera sutil -->
  <line x1="14" y1="80"  x2="281" y2="80"  stroke="#e0ddd9" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="148" x2="281" y2="148" stroke="#e0ddd9" stroke-width="0.8" opacity="0.6"/>
  <line x1="14" y1="216" x2="281" y2="216" stroke="#e0ddd9" stroke-width="0.8" opacity="0.6"/>
</svg>